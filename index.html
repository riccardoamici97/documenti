<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documento riservato</title>
<style>
:root { --bg: #FAF9F5; --card: #FFFFFF; --text: #141413; --muted: #73726C; --line: #E8E6DC; --hover: #F0EEE6; --accent: #D97757; --ko: #A8432A; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
main { width: 100%; max-width: 400px; padding: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
h1 { margin: 0 0 6px; font: 600 24px Georgia, "Times New Roman", serif; }
p { margin: 0 0 18px; color: var(--muted); }
label { display: block; margin-bottom: 6px; font-weight: 600; }
.campo { display: flex; gap: 8px; }
input[type=password], input[type=text] { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 16px; font-family: inherit; }
button { padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--text); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
button:hover { background: var(--hover); }
button.principale { width: 100%; margin-top: 16px; border-color: var(--accent); background: var(--accent); color: #fff; }
button.principale:hover { filter: brightness(.95); }
button:disabled { opacity: .6; cursor: default; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ricorda { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-weight: 400; color: var(--muted); }
#msg { min-height: 1.5em; margin: 14px 0 0; color: var(--ko); font-size: 14px; }
#msg.info { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Documento riservato</h1>
  <p>Inserisci la password che ti è stata comunicata per aprire il bilancio.</p>
  <form id="f">
    <label for="pw">Password</label>
    <div class="campo">
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="button" id="mostra" aria-pressed="false">Mostra</button>
    </div>
    <label class="ricorda"><input type="checkbox" id="ricorda"> Ricordami su questo dispositivo</label>
    <button class="principale" type="submit" id="apri">Apri</button>
    <p id="msg" role="alert"></p>
  </form>
</main>

<script>
(function () {
  var D = JSON.parse(document.getElementById('cifrato').textContent);
  var f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg');
  var apri = document.getElementById('apri'), mostra = document.getElementById('mostra'), ricorda = document.getElementById('ricorda');
  var memoria = 'bilancio.chiave.' + D.s;
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function base64(a) { var s = ''; a = new Uint8Array(a); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function decifra(chiave) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.i) }, chiave, bytes(D.c)).then(function (b) { return new TextDecoder().decode(b); });
  }
  function scrivi(html) {
    try {
      var parsed = new DOMParser().parseFromString(html, 'text/html');
      if (parsed && parsed.documentElement) {
        var scripts = Array.from(parsed.querySelectorAll('script'));
        scripts.forEach(function (s) { s.remove(); });
        document.documentElement.replaceWith(parsed.documentElement);
        scripts.forEach(function (oldScript) {
          var s = document.createElement('script');
          Array.from(oldScript.attributes).forEach(function (attr) {
            s.setAttribute(attr.name, attr.value);
          });
          s.textContent = oldScript.textContent;
          (document.body || document.documentElement).appendChild(s);
        });
        if (window.Alpine && typeof window.Alpine.start === 'function') {
          window.Alpine.start();
        }
        return;
      }
    } catch (e) {}
    document.open();
    document.write(html);
    document.close();
  }
  function deriva(password) {
    var enc = new TextEncoder().encode(password.normalize('NFC'));
    return crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(D.s), iterations: D.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function ricordaChiave(chiave) {
    return crypto.subtle.exportKey('raw', chiave).then(function (raw) { try { localStorage.setItem(memoria, base64(raw)); } catch (e) {} });
  }
  mostra.addEventListener('click', function () {
    var visibile = pw.type === 'text';
    pw.type = visibile ? 'password' : 'text';
    mostra.textContent = visibile ? 'Mostra' : 'Nascondi';
    mostra.setAttribute('aria-pressed', String(!visibile));
  });
  if (!(window.crypto && crypto.subtle)) {
    msg.textContent = 'Questo browser non consente di aprire il documento da questo indirizzo. Usa un indirizzo https oppure scarica il file e aprilo dal computer.';
    apri.disabled = true;
    return;
  }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    apri.disabled = true;
    msg.className = 'info';
    msg.textContent = 'Verifica in corso…';
    deriva(pw.value).then(function (chiave) {
      return decifra(chiave).then(function (html) {
        var salva = ricorda.checked ? ricordaChiave(chiave) : Promise.resolve();
        return salva.then(function () { scrivi(html); });
      });
    }).catch(function () {
      msg.className = '';
      msg.textContent = 'Password errata.';
      apri.disabled = false;
      pw.focus();
    });
  });
  var salvata = null;
  try { salvata = localStorage.getItem(memoria); } catch (e) {}
  if (salvata) {
    crypto.subtle.importKey('raw', bytes(salvata), { name: 'AES-GCM' }, false, ['decrypt'])
      .then(decifra).then(scrivi)
      .catch(function () { try { localStorage.removeItem(memoria); } catch (e) {} });
  }
})();
